<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificar Firma Digital</title>
  <link rel="stylesheet" href="/css/verify.css">
</head>
<body>

<div class="card">

  <div class="logo">
    <div class="logo-icon">🔍</div>
    <h1>Verificar Firma</h1>
    <p class="subtitle">Comprueba la autenticidad de un documento firmado</p>
  </div>

  <!-- Resultado de verificación (visible solo tras POST) -->
  <div id="verifyResult" class="result-box __VCLASS__" style="display:none;">
    <div class="result-status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      __VSTATUS__
    </div>
    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Firmante</span>
        <span class="info-value">__VSIGNER__</span>
      </div>
      <div class="info-item">
        <span class="info-label">Cédula</span>
        <span class="info-value">__VCI__</span>
      </div>
      <div class="info-item" style="grid-column: 1 / -1;">
        <span class="info-label">Fecha y hora (UTC)</span>
        <span class="info-value">__VTS__</span>
      </div>
    </div>
  </div>

  <!-- Error de token inválido / clave no encontrada -->
  <div id="verifyErr" class="alert alert-error" style="display:none;">
    <span class="alert-icon">✕</span>
    <span>Token inválido, malformado o el firmante no tiene claves registradas.</span>
  </div>

  <div class="divider"></div>

  <!-- Formulario -->
  <form method="POST" action="/verify">
    <input type="hidden" name="csrf_token" value="__CSRF_TOKEN__">
    <div class="form-group">
      <label for="token">Token de verificación</label>
      <textarea id="token" name="token" rows="5"
        placeholder="Pega aquí el token de verificación que recibiste..."
        required></textarea>
    </div>

    <button type="submit" class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Verificar Firma
    </button>
  </form>

  <div class="links">
    <a href="/dashboard" class="link">← Dashboard</a>
    <a href="/sign" class="link">Firmar un documento →</a>
  </div>

  <div class="security-footer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    RSA-2048 · PSS/SHA-256 · ISO 27001
  </div>

</div>
</body>
</html>
